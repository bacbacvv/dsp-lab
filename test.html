<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSP Web Lab - Demo</title>
    <!-- Nhúng thư viện Chart.js để vẽ đồ thị -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #38bdf8; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-top: 20px; }
        .panel { background-color: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #94a3b8; }
        input[type="range"] { width: 100%; margin-top: 5px; }
        select { width: 100%; padding: 8px; background: #334155; color: white; border: 1px solid #475569; border-radius: 6px; }
        .value-display { float: right; color: #38bdf8; }
        .chart-container { position: relative; height: 220px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔬 DSP Signal & FFT Web Lab</h1>
    
    <div class="grid">
        <!-- KHỐI 1: ĐIỀU KHIỂN ĐẦU VÀO -->
        <div class="panel">
            <h3>⚙️ Cấu Hình Tín Hiệu</h3>
            
            <div class="control-group">
                <label>Dạng sóng (Wave Type)</label>
                <select id="waveType">
                    <option value="sine">Sóng Sine (Tinh khiết)</option>
                    <option value="square">Sóng Vuông (Xung Rect)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Tần số (Frequency): <span class="value-display" id="freqVal">5 Hz</span></label>
                <input type="range" id="frequency" min="1" max="20" value="5" step="1">
            </div>

            <div class="control-group">
                <label>Mức độ nhiễu (Noise): <span class="value-display" id="noiseVal">0.0</span></label>
                <input type="range" id="noise" min="0" max="2" value="0" step="0.1">
            </div>
            
            <p style="font-size: 0.85em; color: #64748b; line-height: 1.4;">
                * Mẹo trực giác: Chọn <b>Sóng Vuông</b> để thấy hiện tượng rò rỉ phổ ra các hài bậc lẻ (Hàm Sinc) trên đồ thị FFT bên cạnh!
            </p>
        </div>

        <!-- KHỐI 2 & 3: BIẾN ĐỔI VÀ ĐỒ THỊ ĐẦU RA -->
        <div class="panel">
            <h3>📈 Miền Thời Gian (Time Domain Input)</h3>
            <div class="chart-container">
                <canvas id="timeChart"></canvas>
            </div>

            <h3>📊 Miền Tần Số (FFT Magnitude Output)</h3>
            <div class="chart-container">
                <canvas id="freqChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // Cấu hình cơ bản của hệ thống DSP
    const Fs = 128; // Tần số lấy mẫu (Samples/second)
    const N = 128;  // Số mẫu để tính toán (Power of 2 để tối ưu)

    // Khởi tạo đồ thị Chart.js
    const ctxTime = document.getElementById('timeChart').getContext('2d');
    const ctxFreq = document.getElementById('freqChart').getContext('2d');

    const timeChart = new Chart(ctxTime, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Biên độ theo thời gian', data: [], borderColor: '#38bdf8', borderWidth: 2, pointRadius: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: -3, max: 3 }, x: { display: false } } }
    });

    const freqChart = new Chart(ctxFreq, {
        type: 'bar',
        data: { labels: [], datasets: [{ label: 'Năng lượng phổ', data: [], backgroundColor: '#f43f5e' }] },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 1.2 } } }
    });

    // Thuật toán Radix-2 FFT cơ bản viết bằng JS thuần
    function dft_analysis(x) {
        const N = x.length;
        let mag = new Array(N / 2).fill(0);
        // Để demo trực quan ngắn gọn, sử dụng DFT (Chạy mượt với N=128)
        for (let k = 0; k < N / 2; k++) {
            let real = 0, imag = 0;
            for (let n = 0; n < N; n++) {
                let angle = (2 * Math.PI * k * n) / N;
                real += x[n] * Math.cos(angle);
                imag -= x[n] * Math.sin(angle);
            }
            mag[k] = Math.sqrt(real*real + imag*imag) / (N / 2);
        }
        return mag;
    }

    // Hàm cập nhật luồng xử lý tín hiệu (Pipeline)
    function updateDSP() {
        const type = document.getElementById('waveType').value;
        const f = parseFloat(document.getElementById('frequency').value);
        const noiseAmp = parseFloat(document.getElementById('noise').value);

        // Cập nhật text hiển thị UI
        document.getElementById('freqVal').innerText = f + ' Hz';
        document.getElementById('noiseVal').innerText = noiseAmp;

        let timeData = [];
        let timeLabels = [];

        // 1. INPUT GENERATOR
        for (let i = 0; i < N; i++) {
            let t = i / Fs;
            let signal = 0;
            
            if (type === 'sine') {
                signal = Math.sin(2 * Math.PI * f * t);
            } else if (type === 'square') {
                signal = Math.sign(Math.sin(2 * Math.PI * f * t));
            }

            // Thêm nhiễu trắng ngẫu nhiên
            let noise = (Math.random() * 2 - 1) * noiseAmp;
            timeData.push(signal + noise);
            timeLabels.push(t.toFixed(3) + 's');
        }

        // 2. TRANSFORM (Chuyển đổi miền tần số)
        let freqData = dft_analysis(timeData);
        let freqLabels = [];
        for (let k = 0; k < N / 2; k++) {
            let freqHz = (k * Fs) / N;
            freqLabels.push(freqHz.toFixed(1) + ' Hz');
        }

        // 3. OUTPUT VISUALIZATION (Đẩy dữ liệu lên đồ thị)
        timeChart.data.labels = timeLabels;
        timeChart.data.datasets[0].data = timeData;
        timeChart.update('none'); // Update chế độ 'none' để siêu mượt, không bị khựng

        freqChart.data.labels = freqLabels;
        freqChart.data.datasets[0].data = freqData;
        freqChart.update('none');
    }

    // Lắng nghe sự kiện người dùng kéo thanh trượt
    document.getElementById('waveType').addEventListener('input', updateDSP);
    document.getElementById('frequency').addEventListener('input', updateDSP);
    document.getElementById('noise').addEventListener('input', updateDSP);

    // Chạy lần đầu tiên khi tải trang
    updateDSP();
</script>
</body>
</html>
